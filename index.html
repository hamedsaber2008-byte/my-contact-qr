<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07152f">
  <title>این وسیله متعلق به من است</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 15%, #245dbb 0, transparent 35%),
        radial-gradient(circle at 90% 85%, #164c91 0, transparent 38%),
        linear-gradient(145deg, #07152f, #102b55 55%, #061329);
    }

    .card {
      width: 100%;
      max-width: 410px;
      padding: 30px 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 30px;
      background: rgba(255,255,255,.105);
      box-shadow:
        0 24px 70px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.20);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(20px, 5.4vw, 25px);
      line-height: 1.6;
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: -.7px;
      text-shadow: 0 2px 15px rgba(0,0,0,.2);
    }

    .subtitle {
      margin: 0 0 26px;
      color: rgba(255,255,255,.86);
      font-size: 14px;
      line-height: 2;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 74px;
      margin: 13px 0;
      padding: 13px 15px;
      color: #fff;
      text-decoration: none;
      text-align: right;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 21px;
      background: rgba(255,255,255,.105);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      transition: transform .18s, background .18s;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .contact:active {
      transform: scale(.98);
      background: rgba(255,255,255,.20);
    }

    .icon {
      width: 47px;
      height: 47px;
      flex: 0 0 47px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      box-shadow: 0 5px 14px rgba(0,0,0,.18);
    }

    .icon svg {
      width: 27px;
      height: 27px;
    }

    .phone {
      background: linear-gradient(145deg, #65e889, #18a957);
    }

    .bale {
      background: linear-gradient(145deg, #38df9b, #079b69);
    }

    .telegram {
      background: linear-gradient(145deg, #58c8ff, #1685db);
    }

    .details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .label {
      font-size: 16px;
      font-weight: 700;
    }

    .value {
      direction: ltr;
      text-align: right;
      color: rgba(255,255,255,.75);
      font-size: 13px;
    }

    .footer {
      margin-top: 24px;
      color: rgba(255,255,255,.48);
      font-size: 11px;
    }

    @media (max-width: 350px) {
      .card {
        padding: 25px 13px;
      }

      h1 {
        font-size: 19px;
        letter-spacing: -.8px;
      }

      .label {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>این وسیله متعلق به من است</h1>

    <p class="subtitle">
      لطفاً با یکی از روش‌های زیر با من تماس بگیرید.
    </p>

    <a class="contact" href="tel:+989120766490">
      <span class="icon phone">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="#ffffff" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2
          19.8 19.8 0 0 1-8.63-3.07
          19.5 19.5 0 0 1-6-6
          A19.8 19.8 0 0 1 2.12 4.18
          2 2 0 0 1 4.11 2h3
          a2 2 0 0 1 2 1.72
          c.12.96.36 1.9.7 2.8
          a2 2 0 0 1-.45 2.11L8.1 9.9
          a16 16 0 0 0 6 6l1.27-1.26
          a2 2 0 0 1 2.11-.45
          c.9.34 1.84.58 2.8.7
          A2 2 0 0 1 22 16.92z"/>
        </svg>
      </span>
      <span class="details">
        <span class="label">تماس تلفنی</span>
        <span class="value">09120766490</span>
      </span>
    </a>

    <a class="contact" href="https://ble.ir/H_saber1"
       target="_blank" rel="noopener noreferrer">
      <span class="icon bale">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="#ffffff" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8
          8.5 8.5 0 0 1-7.6 4.7
          8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7
          a8.4 8.4 0 0 1-.9-3.8
          8.5 8.5 0 0 1 4.7-7.6
          8.4 8.4 0 0 1 3.8-.9h.5
          a8.5 8.5 0 0 1 8 8z"/>
          <path d="M8 12h.01M12 12h.01M16 12h.01"
                stroke-width="2.8"/>
        </svg>
      </span>
      <span class="details">
        <span class="label">تماس در بله</span>
        <span class="value">@H_saber1</span>
      </span>
    </a>

    <a class="contact"
       href="tg://resolve?domain=H_saber1">
      <span class="icon telegram">
        <svg viewBox="0 0 24 24" fill="#ffffff"
             aria-hidden="true">
          <path d="M21.8 3.2 18.5 20c-.25 1.18-.92
          1.47-1.87.92l-5.18-3.82-2.5 2.4
          c-.28.28-.52.52-1.06.52l.37-5.28
          9.61-8.68c.42-.37-.09-.58-.65-.21L5.34
          13.42.2 11.81c-1.12-.35-1.14-1.12.24-1.67
          L20.56 2.5c.92-.34 1.72.22 1.24.7z"/>
        </svg>
      </span>
      <span class="details">
        <span class="label">تماس در تلگرام</span>
        <span class="value">@H_saber1</span>
      </span>
    </a>

    <div class="footer">از توجه شما سپاسگزارم</div>
  </main>
</body>
</html>
